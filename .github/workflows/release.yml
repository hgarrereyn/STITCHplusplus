# Release: push a tag vX.Y.Z (matching the version in pyproject.toml).
#  1. builds the STITCH base and toolchain images for amd64 and arm64 and pushes them to
#     ghcr.io/<owner>/stitch-base:<hash> and stitch-toolchain:<hash>. <hash> is the source hash the
#     CLI computes, so `stitch setup` pulls exactly the image for its version.
#  2. publishes stitch-fuzz to PyPI (trusted publishing: configure this repo + workflow + the
#     "pypi" environment on pypi.org once).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "also publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.h.outputs.base }}
      toolchain: ${{ steps.h.outputs.toolchain }}
      registry: ${{ steps.h.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: h
        run: |
          echo "base=$(PYTHONPATH=cli python3 -c 'from stitch_fuzz import docker; print(docker.stitch_hash())')" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(PYTHONPATH=cli python3 -c 'from stitch_fuzz import docker; print(docker.toolchain_hash())')" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    needs: hashes
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      R: ${{ needs.hashes.outputs.registry }}
      BASE: ${{ needs.hashes.outputs.base }}
      TOOLCHAIN: ${{ needs.hashes.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: base image
        run: |
          docker buildx build -f docker/base.Dockerfile --target base \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$R/stitch-base:$BASE-${{ matrix.arch }}" --push .
      - name: toolchain image
        run: |
          docker buildx build -f docker/base.Dockerfile --target toolchain \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$R/stitch-toolchain:$TOOLCHAIN-${{ matrix.arch }}" --push .

  manifests:
    needs: [hashes, images]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      R: ${{ needs.hashes.outputs.registry }}
      BASE: ${{ needs.hashes.outputs.base }}
      TOOLCHAIN: ${{ needs.hashes.outputs.toolchain }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$R/stitch-base:$BASE" "$R/stitch-base:$BASE-amd64" "$R/stitch-base:$BASE-arm64"
          docker buildx imagetools create -t "$R/stitch-toolchain:$TOOLCHAIN" "$R/stitch-toolchain:$TOOLCHAIN-amd64" "$R/stitch-toolchain:$TOOLCHAIN-arm64"

  pypi:
    needs: manifests
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python3 -m pip install build && python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
