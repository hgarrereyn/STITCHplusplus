# Release: push a tag vX.Y.Z (matching the version in pyproject.toml).
#  1. builds the images for amd64 and arm64 and pushes them to ghcr.io/<owner>/:
#       stitch-engine:<engine hash>                 the fuzzer (build outputs only)
#       stitch-<lang>:<base hash>                   language toolchain + runtime + engine
#       stitch-<lang>-toolchain:<toolchain hash>    language toolchain + runtime (reproducers)
#     The hashes are the source hashes the CLI computes, so `stitch setup` pulls exactly the images
#     for its version.
#  2. publishes stitch-fuzz to PyPI (trusted publishing: configure this repo + workflow + the
#     "pypi" environment on pypi.org once).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "also publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

env:
  HASH: PYTHONPATH=cli python3 -c 'import sys; from stitch_fuzz import docker as d; print(getattr(d, sys.argv[1])(*sys.argv[2:]))'

jobs:
  engine:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: engine image
        run: |
          R=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}; E=$(eval "$HASH engine_hash")
          docker buildx build -f engine/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$R/stitch-engine:$E-${{ matrix.arch }}" --push engine

  languages:
    needs: engine
    strategy:
      matrix:
        lang: [cpp, python, javascript, java, go, rust, ruby, swift]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: toolchain and base images
        run: |
          R=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}; L=${{ matrix.lang }}; A=${{ matrix.arch }}
          E=$(eval "$HASH engine_hash"); T=$(eval "$HASH toolchain_hash $L"); B=$(eval "$HASH base_hash $L")
          label=org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # the build context as the CLI assembles it (Swift: languages/swift + the C/C++ runtime)
          C=$(PYTHONPATH=cli STITCH_CACHE=/tmp/stitch-cache python -c "from stitch_fuzz import docker; print(docker.language_context('$L'))")
          docker buildx build -f $C/Dockerfile --target toolchain --label $label \
            -t "$R/stitch-$L-toolchain:$T-$A" --push $C
          docker buildx build -f $C/Dockerfile --target base --label $label \
            --build-arg "STITCH_ENGINE=$R/stitch-engine:$E-$A" \
            -t "$R/stitch-$L:$B-$A" --push $C

  manifests:
    needs: languages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          R=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          multi() { docker buildx imagetools create -t "$1" "$1-amd64" "$1-arm64"; }
          multi "$R/stitch-engine:$(eval "$HASH engine_hash")"
          for L in cpp python javascript java go rust ruby swift; do
            multi "$R/stitch-$L-toolchain:$(eval "$HASH toolchain_hash $L")"
            multi "$R/stitch-$L:$(eval "$HASH base_hash $L")"
          done

  pypi:
    needs: manifests
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python3 -m pip install build && python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
