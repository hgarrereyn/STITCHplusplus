# STITCH++ project. Guide: `stitch guide`. Go API: `stitch guide go`.
[project]
stitch_version = "0.2.0"
name = "expr"
language = "go"

[source]
git = "https://github.com/expr-lang/expr"
rev = "v1.15.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[go]
module = "github.com/antonmedv/expr" # import path of the library (its source is at /src)
instrument = ["github.com/antonmedv/expr/..."]   # packages to instrument (default: all but std)
# race = true                       # build with the race detector

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
