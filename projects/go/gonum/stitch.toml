# STITCH++ project. Guide: `stitch guide`. Go API: `stitch guide go`.
[project]
name = "gonum"
language = "go"

[source]
git = "https://github.com/gonum/gonum"
rev = "v0.12.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[go]
module = "gonum.org/v1/gonum" # import path of the library (its source is at /src)
instrument = ["gonum.org/v1/gonum/..."]   # packages to instrument (default: all but std)
# race = true                       # build with the race detector

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
