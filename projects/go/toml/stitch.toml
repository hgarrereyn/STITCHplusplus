# STITCH++ project. Guide: `stitch guide`. Go API: `stitch guide go`.
[project]
name = "toml"
language = "go"

[source]
git = "https://github.com/BurntSushi/toml"
rev = "v1.0.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[go]
module = "example.com/toml"    # import path of the library (its source is at /src)
# instrument = ["example.com/toml/..."]   # packages to instrument (default: all but std)
# race = true                       # build with the race detector

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
