# STITCH++ project. Guide: `stitch guide`. Rust API: `stitch guide rust`.
[project]
name = "pulldown-cmark"
language = "rust"

[source]
git = "https://github.com/pulldown-cmark/pulldown-cmark"
rev = "v0.8.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[rust.dependencies]                 # the harness crate's dependencies (the library is at /src)
pulldown-cmark = { path = "/src", default-features = false }

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
