# STITCH++ project. Guide: `stitch guide`. Rust API: `stitch guide rust`.
[project]
name = "chrono"
language = "rust"

[source]
git = "https://github.com/chronotope/chrono"
rev = "v0.4.19"   # branch, tag or commit; `stitch build --rev X` overrides it

[rust.dependencies]                 # the harness crate's dependencies (the library is at /src)
chrono = { path = "/src" }

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
