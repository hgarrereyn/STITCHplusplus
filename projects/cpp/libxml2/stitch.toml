# STITCH++ project. Guide: `stitch guide`. API reference: `stitch guide api`.
[project]
name = "libxml2"

[source]
git = "https://github.com/GNOME/libxml2"
rev = "v2.11.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[build]
# How stubs compile and link. Paths are inside the image; the library source is at /src.
cflags = ["-I/src/include", "-I/src/build"]
ldflags = ["/src/build/libxml2.a", "-lm"]               # e.g. ["/src/build/libfoo.a"] or ["-L/src/build", "-lfoo"]
sanitizers = ["address"]   # add "undefined" for UBSan

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
exceptions = "finding"     # "bail": treat uncaught C++ exceptions from the library as failed calls
