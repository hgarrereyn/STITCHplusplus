# STITCH++ project. Guide: `stitch guide`. API reference: `stitch guide api`.
[project]
name = "quickjs"

[source]
git = "https://github.com/quickjs-ng/quickjs"
rev = "97d23e51dcc835e42c4cd419fb4adee13baf0074"           # branch, tag or commit; `stitch build --rev X` overrides

[build]
# How the harness compiles and links against the library *inside the project image*.
# The library source is at /src (see Dockerfile).
cflags = ["-I/src"]
ldflags = ["/src/build/libqjs.a", "-lm", "-ldl", "-lpthread"]
sanitizers = ["address"]   # add "undefined" for UBSan

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
exceptions = "finding"  # or "bail": treat uncaught C++ exceptions from the library as bails
