# STITCH++ project. Guide: `stitch guide`. Swift API: `stitch guide swift`.
[project]
stitch_version = "0.2.0"
name = "swiftsoup"
language = "swift"

[source]
git = "https://github.com/scinfu/SwiftSoup"
rev = "8397a860c6955924b584c50c5265c6aac0970015"   # master HEAD (= tag 2.14.4); `stitch build --rev X` overrides it

[swift]
dependencies = ['.package(path: "/src")']                            # SwiftPM dependencies of the harness
products = ['.product(name: "SwiftSoup", package: "src")']             # the library products it imports

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
