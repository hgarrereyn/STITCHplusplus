# STITCH++ project. Guide: `stitch guide`. Swift API: `stitch guide swift`.
[project]
name = "swift-collections"
language = "swift"

[source]
git = "https://github.com/apple/swift-collections"
rev = "1.1.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[swift]
dependencies = ['.package(path: "/src")']                            # SwiftPM dependencies of the harness
products = ['.product(name: "DequeModule", package: "src")', '.product(name: "OrderedCollections", package: "src")', '.product(name: "HeapModule", package: "src")', '.product(name: "BitCollections", package: "src")', '.product(name: "HashTreeCollections", package: "src")']             # the library products it imports

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
