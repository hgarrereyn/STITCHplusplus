# STITCH project. Guide: `stitch guide`. Swift API: `stitch guide swift`.
[project]
name = "cryptoswift"
language = "swift"

[source]
git = "https://github.com/krzyzanowskim/CryptoSwift"
rev = "1.6.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[swift]
dependencies = ['.package(path: "/src")']                            # SwiftPM dependencies of the harness
products = ['.product(name: "CryptoSwift", package: "src")']             # the library products it imports

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
