# STITCH++ project. Guide: `stitch guide`. Swift API: `stitch guide swift`.
[project]
stitch_version = "0.2.0"
name = "yams"
language = "swift"

[source]
git = "https://github.com/jpsim/Yams"
rev = "4.0.6"   # branch, tag or commit; `stitch build --rev X` overrides it

[swift]
dependencies = ['.package(path: "/src")']                            # SwiftPM dependencies of the harness
products = ['.product(name: "Yams", package: "src")']             # the library products it imports

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
