# STITCH++ project. Guide: `stitch guide`. Swift API: `stitch guide swift`.
[project]
name = "ink"
language = "swift"

[source]
git = "https://github.com/JohnSundell/Ink"
rev = "0.5.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[swift]
dependencies = ['.package(path: "/src")']                            # SwiftPM dependencies of the harness
products = ['.product(name: "Ink", package: "src")']             # the library products it imports

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
