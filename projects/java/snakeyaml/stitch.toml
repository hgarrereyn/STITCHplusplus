# STITCH++ project. Guide: `stitch guide`. Java API: `stitch guide java`.
[project]
stitch_version = "0.2.0"
name = "snakeyaml"
language = "java"

[source]
git = "https://bitbucket.org/snakeyaml/snakeyaml"
rev = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b"   # master HEAD (2.8-SNAPSHOT); `stitch build --rev X` overrides it

[java]
classpath = ["/deps/*"]           # the library and its dependencies (jars the Dockerfile puts in /deps)
include = ["org.yaml.snakeyaml"]
sources = ["/src/src/main/java"]

[fuzz]
timeout_ms = 3000
max_nodes = 24
jobs = 1
