# STITCH++ project. Guide: `stitch guide`. Python API: `stitch guide python`.
[project]
stitch_version = "0.2.0"
name = "jinja2"
language = "python"

[source]
git = "https://github.com/pallets/jinja"
rev = "3.0.0"   # branch, tag or commit; `stitch build --rev X` overrides it

[python]
include = ["jinja2"]     # import names of the code under test (coverage and comparison tracing)

[fuzz]
timeout_ms = 3000
max_nodes = 24
jobs = 1
