# STITCH++ project. Guide: `stitch guide`. Ruby API: `stitch guide ruby`.
[project]
name = "activesupport"
language = "ruby"

[source]
git = "https://github.com/rails/rails"
rev = "v7.0.4.3"   # branch, tag or commit; `stitch build --rev X` overrides it

[ruby]
include = ["/src/activesupport/lib"]   # gem names (or path prefixes) of the code under test

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
