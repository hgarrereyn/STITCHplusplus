# STITCH++ project. Guide: `stitch guide`. Ruby API: `stitch guide ruby`.
[project]
stitch_version = "0.2.0"
name = "rexml"
language = "ruby"

[source]
git = "https://github.com/ruby/rexml"
rev = "e38f44fb7b183040e32acf26a7b82b999c316f1a"   # master HEAD (v3.4.4 + 63); `stitch build --rev X` overrides it

[ruby]
include = ["/src/lib"]     # gem names (or path prefixes) of the code under test

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
