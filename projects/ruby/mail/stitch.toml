# STITCH++ project. Guide: `stitch guide`. Ruby API: `stitch guide ruby`.
[project]
stitch_version = "0.2.0"
name = "mail"
language = "ruby"

[source]
git = "https://github.com/mikel/mail"
rev = "2.7.1"   # branch, tag or commit; `stitch build --rev X` overrides it

[ruby]
include = ["/src/lib"]   # gem names (or path prefixes) of the code under test

[fuzz]
timeout_ms = 2000
max_nodes = 24
jobs = 1
