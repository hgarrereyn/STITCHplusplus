# STITCH project. Guide: `stitch guide`. Ruby API: `stitch guide ruby`.
[project]
name = "rack"
language = "ruby"

[source]
git = "https://github.com/rack/rack"
rev = "2.2.3"   # branch, tag or commit; `stitch build --rev X` overrides it

[ruby]
include = ["/src/lib"]     # gem names (or path prefixes) of the code under test

[fuzz]
timeout_ms = 1000
max_nodes = 24
jobs = 1
